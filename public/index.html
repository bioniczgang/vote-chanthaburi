<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>โหวตกันเถอะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Anuphan:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<style>
/* Layout: one column app — header, tabs, activity cards with vote bars, live chat docked at the bottom. Candy palette. */
:root{
  --bg:#fff6fa; --surface:#ffffff; --ink:#2c1a33; --muted:#7d6886; --line:#f2dbe8;
  --accent:#ff4f8b; --accent-ink:#ffffff; --boost:#f5a524; --ok:#14a37f; --warn:#e5484d;
  --soft:#ffe8f1; --soft2:#f7f0ff;
  --display:"Mitr","Anuphan",system-ui,sans-serif;
  --body:"Anuphan","Mitr",system-ui,sans-serif;
  --r:18px; --shadow:0 6px 24px -12px rgba(160,40,100,.35);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1220; --surface:#261a2d; --ink:#f8eefa; --muted:#bba7c5; --line:#3b2b45;
    --accent:#ff6b9e; --accent-ink:#1b1220; --boost:#ffbe4d; --ok:#3ccf9f; --warn:#ff6b6f;
    --soft:#3a2033; --soft2:#2e2240; --shadow:0 6px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1220; --surface:#261a2d; --ink:#f8eefa; --muted:#bba7c5; --line:#3b2b45;
  --accent:#ff6b9e; --accent-ink:#1b1220; --boost:#ffbe4d; --ok:#3ccf9f; --warn:#ff6b6f;
  --soft:#3a2033; --soft2:#2e2240; --shadow:0 6px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(circle at 10% 0%,var(--soft) 0,transparent 40%),radial-gradient(circle at 95% 10%,var(--soft2) 0,transparent 35%);background-attachment:fixed}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}

/* buttons & inputs */
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.5rem 1rem;cursor:pointer;
  display:inline-flex;align-items:center;gap:.4rem;font-weight:500;transition:transform .12s,background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.boost{background:color-mix(in srgb,var(--boost) 18%,var(--surface));border-color:color-mix(in srgb,var(--boost) 55%,transparent)}
.btn.done{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:.3rem .7rem;font-size:.85rem}
.btn.block{width:100%;justify-content:center}
label{display:grid;gap:.3rem;font-size:.9rem;color:var(--muted)}
input[type=text],input[type=password],input[type=number],input[type=datetime-local],select,textarea{
  width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:.6rem .8rem;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:70px}
.check{display:flex;align-items:center;gap:.5rem;color:var(--ink);font-size:.95rem}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.stack{display:grid;gap:.8rem}
.row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.spacer{flex:1}

.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:1.1rem;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.15rem .6rem;font-size:.8rem;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.live{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.chip.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite}
.chip.up{background:color-mix(in srgb,var(--boost) 20%,var(--surface))}
.chip.end{background:var(--soft2);color:var(--muted)}
@keyframes pulse{50%{opacity:.25}}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1.5px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:.6rem;padding-top:.6rem;padding-bottom:.6rem;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.25rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
.brand .dot{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1rem}
.me{display:flex;align-items:center;gap:.4rem;border:1.5px solid var(--line);border-radius:999px;padding:.2rem .7rem .2rem .25rem;background:var(--surface)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:1.05rem;flex:none}
.bal{font-weight:600;color:color-mix(in srgb,var(--boost) 75%,var(--ink))}
nav.tabs{display:flex;gap:.3rem;padding:.7rem 0 .2rem;overflow-x:auto}
nav.tabs button{border:0;background:transparent;padding:.5rem .9rem;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;padding:1.2rem 0 .6rem}
.hero h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:600}
.stats{display:flex;gap:.5rem;flex-wrap:wrap}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.45rem .8rem;font-size:.85rem;color:var(--muted)}
.stat b{font-family:var(--display);color:var(--ink);font-size:1.1rem;margin-right:.2rem}
.announce{border-radius:14px;padding:.7rem 1rem;background:color-mix(in srgb,var(--boost) 16%,var(--surface));border:1.5px dashed color-mix(in srgb,var(--boost) 60%,transparent);margin:.4rem 0 1rem}

/* polls */
.polls{display:grid;gap:1.1rem;padding-bottom:1.2rem}
.poll{position:relative;overflow:hidden;padding:0}
.poll .stripe{height:8px;background:var(--t)}
.poll .in{padding:1.1rem 1.15rem 1.15rem;display:grid;gap:.85rem}
.poll .head{display:flex;gap:.8rem;align-items:flex-start}
.poll .pe{font-size:2rem;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--t) 16%,var(--surface))}
.poll h2{font-size:1.25rem}
.poll .desc{color:var(--muted);margin:.15rem 0 .35rem;white-space:pre-wrap}
.cd{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:.92rem}
.winner{border-radius:14px;padding:.75rem .9rem;background:linear-gradient(100deg,color-mix(in srgb,var(--boost) 30%,var(--surface)),color-mix(in srgb,var(--t) 18%,var(--surface)));display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.winner .tro{font-size:1.6rem}
.winner b{font-family:var(--display);font-size:1.05rem}
.opts{display:grid;gap:.6rem}
.opt{border:1.5px solid var(--line);border-radius:16px;padding:.7rem .8rem;display:grid;gap:.45rem;background:var(--bg);transition:border-color .2s}
.opt.mine{border-color:var(--t);background:color-mix(in srgb,var(--t) 7%,var(--bg))}
.opt.win{border-color:var(--boost)}
.opt .l1{display:flex;align-items:center;gap:.55rem}
.opt .oe{font-size:1.35rem;width:34px;text-align:center;flex:none}
.opt .lab{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.opt .lab small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.opt .score{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.opt .score b{font-family:var(--display);font-size:1.15rem}
.bar{height:14px;border-radius:999px;background:color-mix(in srgb,var(--line) 70%,transparent);overflow:hidden;display:flex}
.seg{height:100%;width:0;transition:width .9s cubic-bezier(.2,.9,.25,1)}
.seg.n{background:var(--t);background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.28))}
.seg.b{background:var(--boost);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px)}
@media (prefers-reduced-motion:reduce){.seg{transition:none}.chip.live::before{animation:none}}
.opt .l3{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.voters{display:flex;flex-wrap:wrap;gap:.25rem;flex:1;min-width:0}
.vchip{font-size:.75rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.05rem .45rem;white-space:nowrap}
.veil{filter:blur(5px);pointer-events:none;user-select:none}
.legend{display:flex;gap:.8rem;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.25rem;vertical-align:-1px}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted)}
.empty .big{font-size:2.6rem}

/* chat */
#chat{margin:1rem 0 6rem;padding:0;overflow:hidden;display:flex;flex-direction:column}
.chathead{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.chathead h3{font-size:1.1rem}
.online{display:flex;gap:.35rem;overflow-x:auto;padding:.55rem 1rem;border-bottom:1.5px solid var(--line);background:var(--bg);min-height:52px;align-items:center}
.on{display:flex;align-items:center;gap:.3rem;border-radius:999px;background:var(--surface);border:1px solid var(--line);padding:.15rem .6rem .15rem .2rem;font-size:.82rem;white-space:nowrap;position:relative}
.on .av{width:26px;height:26px;font-size:.9rem;position:relative}
.on .av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.on.typing{border-color:var(--accent)}
.msgs{height:min(56vh,460px);overflow-y:auto;padding:.8rem 1rem;display:flex;flex-direction:column;gap:.55rem;scroll-behavior:smooth}
.msg{display:flex;gap:.5rem;align-items:flex-end;max-width:86%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .bub{background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:.4rem .75rem;min-width:0}
.msg.me .bub{background:color-mix(in srgb,var(--accent) 16%,var(--surface));border-color:color-mix(in srgb,var(--accent) 35%,transparent);border-radius:16px 16px 4px 16px}
.msg .meta{font-size:.74rem;color:var(--muted);display:flex;gap:.35rem;align-items:center}
.msg .meta b{color:var(--ink);font-weight:600}
.adm{background:var(--ink);color:var(--bg);border-radius:6px;padding:0 .3rem;font-size:.66rem}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .txt.big{font-size:2.1rem;line-height:1.2}
.msg .quote{font-size:.78rem;color:var(--muted);border-left:3px solid var(--accent);padding-left:.4rem;margin:.15rem 0 .2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.msg .acts{display:flex;gap:.1rem;opacity:0;transition:opacity .15s}
.msg:hover .acts,.msg:focus-within .acts{opacity:1}
@media (hover:none){.msg .acts{opacity:.7}}
.msg .acts button{border:0;background:transparent;cursor:pointer;font-size:.78rem;color:var(--muted);padding:.2rem .3rem;border-radius:6px}
.msg .acts button:hover{background:var(--soft)}
.sysline{align-self:center;font-size:.78rem;color:var(--muted)}
.typingline{font-size:.78rem;color:var(--muted);padding:0 1rem .3rem;min-height:1.2rem}
.composer{border-top:1.5px solid var(--line);padding:.6rem .8rem;display:grid;gap:.4rem;position:relative}
.replybar{display:flex;align-items:center;gap:.4rem;font-size:.82rem;background:var(--soft);border-radius:10px;padding:.3rem .6rem}
.replybar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inrow{display:flex;gap:.4rem;align-items:center}
.inrow input{border-radius:999px}
.ebtn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.25rem;flex:none}
.picker{position:absolute;bottom:calc(100% + 6px);left:.8rem;right:.8rem;max-width:380px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:.5rem;z-index:5}
.picker .ptabs{display:flex;gap:.25rem;margin-bottom:.35rem}
.picker .ptabs button{border:0;background:var(--bg);border-radius:999px;padding:.2rem .6rem;cursor:pointer;font-size:.8rem}
.picker .ptabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.picker .eg{display:grid;grid-template-columns:repeat(8,1fr);gap:.1rem;max-height:200px;overflow-y:auto}
.picker .eg button{border:0;background:transparent;font-size:1.45rem;padding:.2rem;border-radius:8px;cursor:pointer}
.picker .eg button:hover{background:var(--soft);transform:scale(1.15)}
.picker .eg.stk{grid-template-columns:repeat(5,1fr)}
.picker .eg.stk button{font-size:2rem}
.fab{position:fixed;right:16px;bottom:16px;z-index:30;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.5rem;box-shadow:0 10px 28px -8px color-mix(in srgb,var(--accent) 70%,transparent);cursor:pointer}
.fab .badge{position:absolute;top:-3px;right:-3px;background:var(--ink);color:var(--bg);border-radius:999px;font-size:.72rem;padding:.05rem .4rem;font-weight:600}

/* auth */
.authwrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth{width:100%;max-width:420px;display:grid;gap:1rem}
.auth .logo{text-align:center}
.auth .logo .dot{width:64px;height:64px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:2rem;margin:0 auto .5rem}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:999px;padding:4px;border:1.5px solid var(--line)}
.seg2 button{border:0;background:transparent;border-radius:999px;padding:.45rem;cursor:pointer;font-weight:500}
.seg2 button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.avpick{display:flex;flex-wrap:wrap;gap:.3rem}
.avpick button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:1.3rem;cursor:pointer}
.avpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);transform:scale(1.08)}
.err{color:var(--warn);font-size:.88rem;min-height:1.2em}

/* topup */
.pkgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem}
.pkg{border:1.5px solid var(--line);border-radius:16px;padding:.7rem;text-align:center;cursor:pointer;background:var(--bg)}
.pkg[aria-pressed="true"]{border-color:var(--boost);background:color-mix(in srgb,var(--boost) 14%,var(--surface))}
.pkg b{display:block;font-family:var(--display);font-size:1.3rem}
.pkg .bonus{font-size:.75rem;color:var(--ok)}
.paybox{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:center;background:var(--bg);border-radius:16px;padding:.9rem;border:1.5px dashed var(--line)}
@media (max-width:520px){.paybox{grid-template-columns:1fr;justify-items:center;text-align:center}}
.qr{background:#fff;padding:8px;border-radius:12px;width:176px;height:176px}
.qr img,.qr canvas{width:160px!important;height:160px!important}
.hist{display:grid;gap:.5rem}
.hrow{display:flex;align-items:center;gap:.6rem;border:1.5px solid var(--line);border-radius:14px;padding:.55rem .8rem;flex-wrap:wrap;background:var(--bg)}
.st-pending{color:var(--boost)} .st-ok{color:var(--ok)} .st-no{color:var(--warn)}
.balbig{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.balbig .v{font-family:var(--display);font-size:2.2rem;font-weight:600;color:color-mix(in srgb,var(--boost) 70%,var(--ink))}

/* admin */
.subtabs{display:flex;gap:.35rem;flex-wrap:wrap;margin:1rem 0}
.subtabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .85rem;cursor:pointer}
.subtabs button[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.alist{display:grid;gap:.6rem;padding-bottom:1rem}
.arow{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
.arow .t{flex:1;min-width:180px}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{color:var(--muted);font-weight:500}
.tblwrap{overflow-x:auto}
.slip{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.optrow{display:grid;grid-template-columns:64px 1fr 1fr auto;gap:.4rem;align-items:center}
@media (max-width:560px){.optrow{grid-template-columns:56px 1fr auto}.optrow .od{grid-column:1/-1}}
.themes{display:flex;gap:.4rem}
.themes button{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.themes button[aria-pressed="true"]{border-color:var(--ink)}

/* modal / toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(30,10,30,.45);display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal .box{background:var(--surface);border-radius:22px;padding:1.2rem;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow-y:auto;display:grid;gap:.9rem;border:1.5px solid var(--line)}
.modal .box.wide{max-width:720px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:80;display:grid;gap:.4rem;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:.6rem 1rem;box-shadow:var(--shadow);animation:tin .25s}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.notice{border-radius:14px;padding:.7rem 1rem;background:var(--soft2);border:1.5px solid var(--line);font-size:.9rem}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;padding:16px}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite;margin:0 auto 1rem}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- v2: admin console, shop, slip checks ---- */
.wrap{max-width:1100px}
.adm-layout{display:grid;grid-template-columns:220px 1fr;gap:1.1rem;align-items:start;padding:1rem 0}
.side{position:sticky;top:118px;display:grid;gap:.25rem;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:.5rem}
.side button{border:0;background:transparent;text-align:left;padding:.55rem .8rem;border-radius:12px;cursor:pointer;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:.5rem}
.side button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.side button .cnt{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:.72rem;padding:0 .45rem}
@media (max-width:780px){.adm-layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow-x:auto}.side button{white-space:nowrap}}
.adm-main{display:grid;gap:1rem;min-width:0}
.adm-main h2{font-size:1.35rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}
.kpi{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:.8rem .95rem;display:grid;gap:.15rem}
.kpi span{color:var(--muted);font-size:.84rem}
.kpi b{font-family:var(--display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpi.warn{border-color:color-mix(in srgb,var(--boost) 60%,transparent);background:color-mix(in srgb,var(--boost) 10%,var(--surface))}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:.2rem;font-size:.84rem}
.checks li::before{content:"✓ ";color:var(--ok);font-weight:700}

.slipprev{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
.slipprev img{width:90px;border-radius:10px;border:1px solid var(--line)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.9rem;padding-bottom:1rem}
.item{padding:0;overflow:hidden;display:flex;flex-direction:column}

.price{font-family:var(--display);font-size:1.25rem;font-weight:600;color:color-mix(in srgb,var(--boost) 75%,var(--ink))}
.soldout{opacity:.55}
.badgeE{font-size:.9em;margin-left:.15rem}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;align-items:end}

.pinbox{max-width:360px;margin:3rem auto;display:grid;gap:.8rem;text-align:center}
.pinbox input{text-align:center;font-size:1.5rem;letter-spacing:.4em}
.tag{display:inline-block;border-radius:6px;padding:0 .4rem;font-size:.74rem;background:var(--soft2);white-space:nowrap}
.tag.t-top{background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.tag.t-boost{background:color-mix(in srgb,var(--boost) 22%,var(--surface))}
.tag.t-shop{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.tag.t-adm{background:var(--ink);color:var(--bg)}

.lb{display:grid;gap:.5rem}

<script>
/* ===== Netlify backend connector: provides claude.use("db"|"user"|"room"|"assets"|"sample") + claude.auth ===== */
(function(){
const TK="vt_token";
const lsG=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsS=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let token=lsG(TK);
async function api(path,body,opts={}){
  const headers={};if(token)headers.authorization="Bearer "+token;
  let payload;if(body instanceof Blob){payload=body;headers["content-type"]=body.type||"application/octet-stream"}else if(body!==undefined){payload=JSON.stringify(body);headers["content-type"]="application/json"}
  let r;try{r=await fetch("/api/"+path,{method:opts.method||(body!==undefined?"POST":"GET"),headers,body:payload})}catch(e){throw{code:"unavailable",message:"network"}}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){if(r.status===401&&j&&j.code==="unauth"&&token){token=null;lsS(TK,null)}throw{code:(j&&j.code)||"unavailable",message:(j&&j.error)||r.statusText,status:r.status}}
  return j}
let ME=null;
const meP=(async()=>{if(!token)return null;try{ME=await api("auth");return ME}catch(e){return null}})();
const cfgP=api("config").catch(()=>({ai:false}));

/* ---- live sync (polling) ---- */
const subs=new Map();let pres=null,presDirty=false,presSent=0,peersWanted=false,timer=null,inflight=false,peerList=[],peerFns=new Set(),lastSync=0;
const meta={fromCache:false,hasPendingWrites:false};
function docSnap(path,v){const id=path.split("/").pop();return{id,exists:v!=null,data:()=>v==null?undefined:v,metadata:meta}}
function colSnap(map){const docs=Object.entries(map||{}).map(([id,v])=>({id,exists:true,data:()=>v,metadata:meta}));return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:meta}}
function schedule(ms){clearTimeout(timer);timer=setTimeout(sync,ms)}
async function sync(){if(inflight){schedule(300);return}inflight=true;
  try{const list=[...subs.values()];const known={};list.forEach(s=>{if(s.h)known[s.key]=s.h});
    const sendPres=ME&&pres&&(presDirty||Date.now()-presSent>12000);
    const res=await api("db",{op:"sync",subs:list.map(s=>({t:s.t,p:s.p})),known,pres:sendPres?pres:undefined,peers:peersWanted&&!!ME});
    if(sendPres){presDirty=false;presSent=Date.now()}
    for(const [key,o] of Object.entries(res.r||{})){const s=subs.get(key);if(!s)continue;s.h=o.h;s.v=o.v;s.has=true;const snap=s.t==="c"?colSnap(o.v):docSnap(s.p,o.v);s.fns.forEach(f=>{try{f(snap)}catch(e){console.error(e)}})}
    if(res.peers){const now=Date.now();const old=new Map(peerList.map(p=>[p.peer,p]));
      peerList=res.peers.map(x=>{const prev=old.get(x.uid);const same=prev&&JSON.stringify(prev.presence)===JSON.stringify(x.p);return same?prev:Object.freeze({peer:x.uid,by:x.uid,isMe:!!ME&&x.uid===ME.uid,sameTab:!!ME&&x.uid===ME.uid,kind:"viewer",guest:false,presence:Object.freeze(x.p||{}),updatedAt:now})});
      if(ME&&!peerList.some(p=>p.isMe))peerList.push(Object.freeze({peer:ME.uid,by:ME.uid,isMe:true,sameTab:true,kind:"viewer",guest:false,presence:Object.freeze(pres||{}),updatedAt:now}));
      const ch={peers:peerList,joined:[],left:[],updated:[]};peerFns.forEach(f=>{try{f(ch)}catch(e){console.error(e)}})}
    lastSync=Date.now()}
  catch(e){console.warn("sync",e)}
  finally{inflight=false;schedule(document.hidden?12000:2500)}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)schedule(50)});
function subscribe(t,p,fn){const key=t+":"+p;let s=subs.get(key);if(!s){s={key,t,p,fns:new Set(),h:null,v:null,has:false};subs.set(key,s)}s.fns.add(fn);
  if(s.has)setTimeout(()=>fn(t==="c"?colSnap(s.v):docSnap(p,s.v)),0);schedule(30);return()=>{s.fns.delete(fn);if(!s.fns.size)subs.delete(key)}}
function bumpLocal(path,data,del){const seg=path.split("/");const col=seg.slice(0,-1).join("/"),id=seg[seg.length-1];
  const s=subs.get("c:"+col);if(s&&s.has){const v={...(s.v||{})};if(del)delete v[id];else v[id]=data;s.v=v;s.h=null}
  const d=subs.get("d:"+path);if(d){d.v=del?null:data;d.h=null}schedule(150)}

const db={
  doc(path){return{id:path.split("/").pop(),path,
    async get(){const r=await api("db",{op:"get",path});return docSnap(path,r.exists?r.data:null)},
    async set(data){await api("db",{op:"set",path,data});bumpLocal(path,data)},
    async update(data){await api("db",{op:"update",path,data});schedule(100)},
    async delete(){await api("db",{op:"delete",path});bumpLocal(path,null,true)},
    onSnapshot(next,err){return subscribe("d",path,next)},
    collection(sub){return db.collection(path+"/"+sub)}}},
  collection(path){return{path,doc:id=>db.doc(path+"/"+(id||Math.random().toString(36).slice(2,12))),
    onSnapshot(next,err){return subscribe("c",path,next)},
    async get(){return new Promise(res=>{const un=subscribe("c",path,s=>{un();res(s)})})},
    where(){return this},orderBy(){return this},limit(){return this}}}
};
const user={id:async()=>ME?ME.uid:null,isOwner:()=>!!ME&&ME.role==="admin",canEdit:()=>!!ME&&ME.role==="admin",can:()=>!!ME,me:async()=>ME};
const room={presence(patch){pres={...(pres||{})};for(const[k,v]of Object.entries(patch||{})){if(v===null)delete pres[k];else pres[k]=v}presDirty=true;schedule(ME?400:5000);return Promise.resolve()},
  onPeers(fn){peerFns.add(fn);peersWanted=true;schedule(30);if(peerList.length)setTimeout(()=>fn({peers:peerList,joined:peerList,left:[],updated:[]}),0);return()=>peerFns.delete(fn)},
  peers:()=>peerList,connected:()=>Date.now()-lastSync<15000,on:()=>()=>{},emit:()=>Promise.resolve()};
const assets={async upload(blob){return await api("asset",blob)}};
async function toB64(blob){let b=blob;try{const bmp=await createImageBitmap(blob);const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);b=await new Promise(r=>c.toBlob(r,"image/jpeg",.9))}catch(e){}
  const buf=new Uint8Array(await b.arrayBuffer());let s="";for(let i=0;i<buf.length;i+=0x8000)s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));return{media_type:b.type||"image/jpeg",data:btoa(s)}}
function makeSample(){const sample=async(input,opts={})=>{const imgs=opts.images?await Promise.all([].concat(opts.images instanceof FileList?[...opts.images]:opts.images).map(toB64)):[];
    const prompt=typeof input==="string"?input:input.map(m=>m.role+": "+m.content).join("\n\n");
    const r=await api("ai",{prompt,images:imgs});if(opts.onText)opts.onText({text:r.text,delta:r.text});return{text:r.text,truncated:false,modelTierApplied:"default"}};
  sample.json=async(input,opts)=>{const{text}=await sample(input,opts);const m=text.match(/\{[\s\S]*\}|\[[\s\S]*\]/);try{return JSON.parse(m?m[0]:text)}catch(e){throw{code:"invalid_json",message:"bad json",text}}};
  sample.limits=async()=>({maxPromptBytes:262144,images:{maxCount:2,maxInputBytes:20e6,mediaTypes:["image/jpeg","image/png","image/webp"]}});return sample}

const authApi={
  me:()=>meP,
  async register(o){const r=await api("auth",{action:"register",...o});token=r.token;lsS(TK,token)},
  async login(username,password){const r=await api("auth",{action:"login",username,password});token=r.token;lsS(TK,token)},
  async changePassword(old,password){const r=await api("auth",{action:"changePassword",old,password});token=r.token;lsS(TK,token)},
  async adminReset(uid,password){await api("auth",{action:"adminReset",uid,password})},
  logout(){token=null;lsS(TK,null)},
  async publicSettings(){const r=await api("db",{op:"sync",subs:[{t:"d",p:"settings/main"}],known:{}});const o=r.r&&r.r["d:settings/main"];return(o&&o.v)||{}}
};
window.claude={auth:authApi,use:async name=>{await meP;
  if(name==="db")return ME?db:null;if(name==="user")return user;if(name==="room")return ME?room:null;if(name==="assets")return ME?assets:null;
  if(name==="sample"){const c=await cfgP;return ME&&ME.role==="admin"&&c.ai?makeSample():null}return null}};
})();

</script>

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const fmtB=n=>Number(n||0).toLocaleString("th-TH",{maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,"0");

function fmtDT(ms){if(!ms)return"-";const d=new Date(ms);return d.toLocaleString("th-TH",{day:"numeric",month:"short",year:"2-digit",hour:"2-digit",minute:"2-digit"})}
function fmtClock(ms){const d=new Date(ms),now=new Date();const t=pad(d.getHours())+":"+pad(d.getMinutes());
  return d.toDateString()===now.toDateString()?t:d.toLocaleDateString("th-TH",{day:"numeric",month:"short"})+" "+t}
function toLocalInput(ms){if(!ms)return"";const d=new Date(ms);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function dur(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
  return (d?d+" วัน ":"")+pad(h)+":"+pad(m)+":"+pad(x)}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const ssGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const ssSet=(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}};
function toast(msg,ms=2600){const t=document.createElement("div");t.className="toast";t.textContent=msg;$("#toasts").appendChild(t);setTimeout(()=>t.remove(),ms)}
function prof(uid){return S.profiles[uid]||{nick:"สมาชิก",av:"🙂",username:""}}

/* per-document write queue */
const Q={};
function enqueue(path,fn){const p=(Q[path]||Promise.resolve()).then(fn);Q[path]=p.catch(()=>{});return p}
function writeErr(e){console.warn(e);const c=e&&e.code;
  if(c==="invalid_argument"){toast("บันทึกไม่ได้: บัญชีนี้ไม่มีสิทธิ์ทำรายการนี้ ลองออกจากระบบแล้วเข้าใหม่",4200)}
  else if(c==="quota_exceeded")toast("พื้นที่ฐานข้อมูลเต็ม แจ้งแอดมินให้ล้างข้อมูลเก่า",4200);
  else if(c==="resource_exhausted")toast("ส่งถี่เกินไป รอสักครู่แล้วลองใหม่");
  else toast("เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง");}
async function safeSet(path,data){try{await S.db.doc(path).set(data);return true}catch(e){
  if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*800));try{await S.db.doc(path).set(data);return true}catch(e2){writeErr(e2);return false}}
  writeErr(e);return false}}

/* password hashing (PBKDF2) */
async function hashPw(pw,salt){const enc=new TextEncoder();
  if(!(crypto&&crypto.subtle)){let h=0;const s=salt+pw;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return "x"+h}
  const key=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:120000,hash:"SHA-256"},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("")}

/* PromptPay QR payload (EMVCo) */
function ppPayload(id,amount){const f=(t,v)=>t+String(v.length).padStart(2,"0")+v;let d=digits(id);if(!d)return"";
  let acc;if(d.length>=15)acc=f("03",d);else if(d.length===13)acc=f("02",d);else acc=f("01",("0000000000000"+("66"+d.replace(/^0/,""))).slice(-13));
  let p=f("00","01")+f("01",amount?"12":"11")+f("29",f("00","A000000677010111")+acc)+f("58","TH")+f("53","764")+(amount?f("54",Number(amount).toFixed(2)):"")+"6304";
  let crc=0xFFFF;for(let i=0;i<p.length;i++){crc^=p.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xFFFF}
  return p+crc.toString(16).toUpperCase().padStart(4,"0")}

/* slip QR decode (Thai bank slips carry a mini-QR with the transaction ref) */
function tlv(s){const o={};let i=0;while(i+4<=s.length){const t=s.slice(i,i+2),l=parseInt(s.slice(i+2,i+4),10);if(!Number.isFinite(l))break;o[t]=s.slice(i+4,i+4+l);i+=4+l}return o}
function slipRef(qr){if(!qr)return"";try{const t=tlv(qr);if(t["00"]){const inner=tlv(t["00"]);if(inner["02"])return inner["02"]}}catch(e){}return qr.slice(0,80)}
async function decodeQR(blob){if(typeof jsQR==="undefined")return"";try{
  const bmp=await createImageBitmap(blob);for(const maxW of [1000,1600,700]){const sc=Math.min(1,maxW/bmp.width);const w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(bmp,0,0,w,h);const img=x.getImageData(0,0,w,h);
    const r=jsQR(img.data,w,h,{inversionAttempts:"attemptBoth"});if(r&&r.data)return r.data}}catch(e){console.warn(e)}return""}
async function slipBlob(r){const url=r.slipUrl||(r.slipId?"/api/asset/"+r.slipId:"");if(!url)return null;
  try{const res=await fetch(url);if(res.ok)return await res.blob()}catch(e){}
  return await new Promise(ok=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext("2d").drawImage(im,0,0);c.toBlob(b=>ok(b),"image/jpeg",.92)};im.onerror=()=>ok(null);im.src=url})}

/* ================= ledger: credits, boosts, shop ================= */
function grantedTotal(uid){const a=S.approvals[uid];if(!a||!a.granted)return 0;return Object.values(a.granted).reduce((s,v)=>s+num(v),0)}
function pollStatus(p,now=Date.now()){if(p.startAt&&now<p.startAt)return"up";if(p.endAt&&now>=p.endAt)return"end";return"live"}
function inWindow(p,t){return (!p.startAt||t>=p.startAt)&&(!p.endAt||t<=p.endAt+5000)}
function priceAt(item,t){const h=Array.isArray(item.priceHistory)&&item.priceHistory.length?item.priceHistory:[{price:item.price,from:0}];
  let p=num(h[0].price);for(const x of h){if(num(x.from)<=t)p=num(x.price)}return p}
function stockOf(item){return item.stock===""||item.stock==null?null:num(item.stock)}
let _L=null;
function ledger(){if(_L)return _L;const ev=[];
  for(const [uid,b] of Object.entries(S.ballots))(Array.isArray(b.boosts)?b.boosts:[]).forEach(x=>ev.push({k:"b",uid,at:num(x.at),x}));
  for(const [uid,o] of Object.entries(S.orders))for(const [oid,x] of Object.entries(o.orders||{}))ev.push({k:"o",uid,oid,at:num(x.at),x});
  ev.sort((a,b)=>a.at-b.at);
  const spent={},perPoll={},sold={},pu={},boosts=[],ord={},badge={};
  for(const e of ev){const g=grantedTotal(e.uid),sp=spent[e.uid]||0;
    if(e.k==="b"){const x=e.x,p=S.polls[x.pid],pts=Math.floor(num(x.pts));
      if(!p||!p.allowBoost||pts<=0||!inWindow(p,e.at)||!(p.options||[]).some(o=>o.id===x.opt))continue;
      const key=e.uid+"|"+x.pid,cap=num(p.boostCap);if(cap>0&&(perPoll[key]||0)+pts>cap)continue;
      if(sp+pts>g)continue;spent[e.uid]=sp+pts;perPoll[key]=(perPoll[key]||0)+pts;boosts.push({uid:e.uid,pid:x.pid,opt:x.opt,pts,at:e.at});continue}
    const x=e.x,item=S.shop[x.item],st=((S.deliveries[e.uid]||{}).s||{})[e.oid],qty=Math.max(1,Math.floor(num(x.qty,1))),key=e.uid+":"+e.oid;
    const base={uid:e.uid,oid:e.oid,item:x.item,name:item?item.name:(x.name||"สินค้าที่ถูกลบ"),qty,at:e.at,state:st?st.state:"pending"};
    if(st&&st.state==="refunded"){ord[key]={...base,valid:false,cost:0,reason:"คืนเพชรแล้ว"};continue}
    if(!item){ord[key]={...base,valid:false,cost:0,reason:"สินค้าถูกลบ"};continue}
    const cost=priceAt(item,e.at)*qty,stock=stockOf(item);
    let reason="";
    if(stock!=null&&(sold[x.item]||0)+qty>stock)reason="สินค้าหมดก่อน";
    else if(num(item.perUser)>0&&(pu[e.uid+x.item]||0)+qty>num(item.perUser))reason="เกินจำนวนต่อคน";
    else if(sp+cost>g)reason="เพชรไม่พอ";
    if(reason){ord[key]={...base,valid:false,cost:0,reason};continue}
    spent[e.uid]=sp+cost;sold[x.item]=(sold[x.item]||0)+qty;pu[e.uid+x.item]=(pu[e.uid+x.item]||0)+qty;
    if(item.kind==="badge")badge[e.uid]=item.badge||item.emoji||"⭐";
    ord[key]={...base,valid:true,cost,reason:""}}
  _L={spent,boosts,ord,sold,badge};return _L}
function invalidate(){_L=null;_ST=null}
function balance(uid){return grantedTotal(uid)-(ledger().spent[uid]||0)}
function myBoostIn(pid){return ledger().boosts.filter(x=>x.uid===S.uid&&x.pid===pid).reduce((s,x)=>s+x.pts,0)}
function cleanChoices(p,v){const ids=new Set((p.options||[]).map(o=>o.id));let c=[...new Set((v&&Array.isArray(v.choices)?v.choices:[]).filter(x=>ids.has(x)))];
  if(p.mode==="single")c=c.slice(0,1);else if(num(p.maxChoices)>0)c=c.slice(0,num(p.maxChoices));return c}
function tally(p){const T={};(p.options||[]).forEach(o=>T[o.id]={votes:0,boost:0,voters:[]});let voters=0;
  for(const [uid,b] of Object.entries(S.ballots)){const v=b.votes&&b.votes[p.id];if(!v||!inWindow(p,num(v.at)))continue;
    const c=cleanChoices(p,v);if(!c.length)continue;voters++;c.forEach(o=>{T[o].votes++;T[o].voters.push(uid)})}
  for(const x of ledger().boosts){if(x.pid!==p.id||!T[x.opt])continue;T[x.opt].boost+=x.pts}
  let grand=0;for(const k in T){T[k].total=T[k].votes+T[k].boost;grand+=T[k].total}
  const key=p.winnerBy==="votes"?"votes":"total";
  const ranked=Object.keys(T).sort((a,b)=>T[b][key]-T[a][key]||T[b].total-T[a].total);
  const n=Math.max(1,num(p.winners,1));let winners=[];
  if(ranked.length&&T[ranked[0]][key]>0){const cut=T[ranked[Math.min(n,ranked.length)-1]][key];winners=ranked.filter(k=>T[k][key]>=cut&&T[k][key]>0)}
  return {T,grand,voters,ranked,winners,key}}
function myVote(pid){const b=S.ballots[S.uid];return b&&b.votes&&b.votes[pid]||null}
function pkgList(){const p=Array.isArray(S.settings.packages)?S.settings.packages:[];return p.filter(x=>num(x.baht)>0&&num(x.pts)>0)}
function ptsFor(baht){const pk=pkgList().find(x=>num(x.baht)===num(baht));if(pk)return num(pk.pts);const pr=num(S.settings.pricePerPoint,1)||1;return Math.floor(num(baht)/pr)}
function reqStatus(uid,k){const a=S.approvals[uid]||{};if(a.granted&&a.granted[k]!=null)return["ok","อนุมัติแล้ว",num(a.granted[k])];if(a.rejected&&a.rejected[k])return["no","ไม่อนุมัติ: "+a.rejected[k],0];return["pending","รอตรวจสอบ",0]}

  S.db=db;S.user=user;S.uid=me.uid;S.isOwner=me.role==="admin";S.account={username:me.username};S.loggedIn=true;

  if(S.isOwner&&location.hash==="#admin")S.tab="admin";

}

function sub(ref,key,cb){const t=setTimeout(()=>{S.stale=true;renderStale()},10000);
  return ref.onSnapshot(s=>{if(!s.metadata.fromCache){clearTimeout(t);if(S.stale){S.stale=false;renderStale()}}S.loaded[key]=true;cb(s)},
    e=>{clearTimeout(t);console.warn(key,e)})}

  sub(db.collection("polls"),"polls",qs=>{S.polls=colMap(qs);invalidate();dirty("view")});
  sub(db.collection("profiles"),"profiles",qs=>{S.profiles=colMap(qs);dirty("all")});
  sub(db.collection("ballots"),"ballots",qs=>{S.ballots=colMap(qs);invalidate();dirty("view")});
  sub(db.collection("approvals"),"approvals",qs=>{S.approvals=colMap(qs);invalidate();dirty("view")});
  sub(db.collection("shop"),"shop",qs=>{S.shop=colMap(qs);invalidate();dirty("view")});
  sub(db.collection("orders"),"orders",qs=>{S.orders=colMap(qs);invalidate();dirty("view")});
  sub(db.collection("deliveries"),"deliveries",qs=>{S.deliveries=colMap(qs);invalidate();dirty("view")});
  scSubscribe();
  sub(db.collection("chat"),"chat",qs=>{S.chats=colMap(qs);renderChatMsgs()});
  if(S.isOwner){
    sub(db.collection("topups"),"topups",qs=>{S.allTopups=colMap(qs);S.myTopups=S.allTopups[S.uid]||null;dirty("view");autoKick()});
    sub(db.collection("orderinfo"),"orderinfo",qs=>{S.orderInfo=colMap(qs);S.myOrderInfo=S.orderInfo[S.uid]||null;dirty("view")});

    sub(db.collection("adminlog"),"adminlog",qs=>{S.adminlog=colMap(qs);dirty("view")});
  }else{
    sub(db.doc("topups/"+S.uid),"topups",s=>{S.myTopups=s.exists?s.data():null;dirty("view")});
    sub(db.doc("orderinfo/"+S.uid),"orderinfo",s=>{S.myOrderInfo=s.exists?s.data():null;dirty("view")});
  }}

function viewPolls(v){const st=S.settings,now=Date.now();
  const list=Object.values(S.polls).filter(p=>p.visible!==false||S.isOwner).sort((a,b)=>{const o={live:0,up:1,end:2};return o[pollStatus(a,now)]-o[pollStatus(b,now)]||num(b.createdAt)-num(a.createdAt)});
  const live=list.filter(p=>pollStatus(p,now)==="live").length;
  let h=`<div class="hero"><div style="flex:1;min-width:240px"><h1>${esc(st.siteName)}</h1><p class="muted" style="margin:.2rem 0 0">${esc(st.tagline)}</p></div>
   <div class="stats"><span class="stat"><b class="num">${live}</b>กำลังเปิดโหวต</span><span class="stat"><b class="num">${Object.keys(S.profiles).length}</b>สมาชิก</span><span class="stat"><b class="num">${onlineList().length}</b>ออนไลน์</span></div></div>`;
  if(st.announcement)h+=`<div class="announce">📣 ${esc(st.announcement)}</div>`;

  else if(!list.length)h+=`<div class="card empty"><div class="big">🗳️</div><h3>ยังไม่มีกิจกรรมให้โหวต</h3><p>${S.isOwner?"ไปที่หลังบ้านเพื่อสร้างกิจกรรมแรก":"รอแอดมินเปิดกิจกรรมเร็วๆ นี้"}</p>${S.isOwner?'<button class="btn pri" data-act="newpoll">สร้างกิจกรรม</button>':""}</div>`;
  else h+=`<div class="polls">${list.map(pollCard).join("")}</div>`;

function pollCard(p){const now=Date.now(),st=pollStatus(p,now),t=tally(p),mv=myVote(p.id),mine=mv?cleanChoices(p,mv):[];

  const stChip=st==="live"?'<span class="chip live">กำลังโหวต</span>':st==="up"?'<span class="chip up">เร็วๆ นี้</span>':'<span class="chip end">จบแล้ว</span>';
  const modeChip=p.mode==="single"?'<span class="chip">เลือกได้ 1 ข้อ · 1 คน 1 ครั้ง · เปลี่ยนไม่ได้</span>':`<span class="chip">เลือกได้${num(p.maxChoices)>0?" สูงสุด "+num(p.maxChoices)+" ข้อ":"ทุกข้อ"}${p.showNames?" · แสดงชื่อผู้โหวต":""}</span>`;
  const boostOn=p.allowBoost&&st==="live";
  let win="";
  if(st==="end"){win=t.winners.length?`<div class="winner"><span class="tro">🏆</span><div><div class="small muted">ผู้ชนะ${num(p.winners,1)>1?" "+num(p.winners)+" อันดับ":""}</div><b>${t.winners.map(k=>{const o=p.options.find(x=>x.id===k);return esc((o.emoji||"")+" "+o.label)}).join(" · ")}</b></div><div class="spacer"></div><span class="small num">${fmtN(t.T[t.winners[0]][t.key])} ${t.key==="votes"?"โหวต":"คะแนน"}</span></div>`:`<div class="winner"><span class="tro">🏁</span><b>ปิดโหวตแล้ว ไม่มีผู้โหวต</b></div>`}
  const leader=t.ranked[0]&&t.T[t.ranked[0]].total>0?t.ranked[0]:null;
  const opts=(p.options||[]).map(o=>{const r=t.T[o.id],pctN=t.grand?r.votes/t.grand*100:0,pctB=t.grand?r.boost/t.grand*100:0,pct=t.grand?Math.round(r.total/t.grand*1000)/10:0;
    const isMine=mine.includes(o.id),isWin=st==="end"&&t.winners.includes(o.id);
    let btn="";
    if(st==="live"){if(p.mode==="single"){btn=mine.length?(isMine?'<button class="btn sm done" disabled>✓ โหวตแล้ว</button>':""):`<button class="btn sm pri" data-act="vote" data-pid="${p.id}" data-opt="${o.id}">โหวต</button>`}
      else{const locked=p.allowChange===false&&isMine;btn=isMine?`<button class="btn sm done" ${locked?"disabled":`data-act="vote" data-pid="${p.id}" data-opt="${o.id}"`}>✓ โหวตแล้ว${locked?"":" (กดเพื่อยกเลิก)"}</button>`:`<button class="btn sm pri" data-act="vote" data-pid="${p.id}" data-opt="${o.id}">โหวต</button>`}
      if(boostOn)btn+=`<button class="btn sm boost" data-act="boost" data-pid="${p.id}" data-opt="${o.id}">⚡ ใช้เพชรเพิ่มคะแนน</button>`}
    const names=p.showNames&&!hideRes?r.voters.slice(0,10).map(u=>`<span class="vchip">${esc(prof(u).av||"")} ${nickHTML(u)}</span>`).join("")+(r.voters.length>10?`<span class="vchip">+${r.voters.length-10}</span>`:""):"";
    const k=p.id+":"+o.id;
    return `<div class="opt ${isMine?"mine":""} ${isWin?"win":""}">
      <div class="l1"><span class="oe">${esc(o.emoji||"•")}</span><span class="lab">${esc(o.label)}${leader===o.id&&st!=="up"&&!hideRes?" 👑":""}${o.desc?`<small>${esc(o.desc)}</small>`:""}</span>
        <span class="score ${hideRes?"veil":""}"><b>${pct}%</b><br><span class="small muted">${fmtN(r.total)} คะแนน</span></span></div>
      <div class="bar ${hideRes?"veil":""}" aria-label="${esc(o.label)} ${pct}%"><div class="seg n" data-k="${k}:n" data-w="${hideRes?0:pctN.toFixed(2)}" style="width:${S.prevW[k+":n"]||0}%"></div><div class="seg b" data-k="${k}:b" data-w="${hideRes?0:pctB.toFixed(2)}" style="width:${S.prevW[k+":b"]||0}%"></div></div>
      <div class="l3"><div class="voters">${names}${!hideRes&&r.boost?`<span class="vchip">⚡ พิเศษ ${fmtN(r.boost)}</span>`:""}</div>${btn}</div></div>`}).join("");
  const myB=myBoostIn(p.id);
  return `<article class="card poll" style="--t:${color}"><div class="stripe"></div><div class="in">
    <div class="head"><div class="pe">${esc(p.emoji||"🗳️")}</div><div style="flex:1;min-width:0">
      <div class="row" style="margin-bottom:.25rem">${stChip}${modeChip}${p.allowBoost?'<span class="chip">⚡ ใช้เพชรเพิ่มคะแนนได้</span>':""}${p.visible===false?'<span class="chip end">ซ่อนอยู่ (เห็นเฉพาะแอดมิน)</span>':""}</div>
      <h2>${esc(p.title)}</h2>${p.desc?`<div class="desc">${esc(p.desc)}</div>`:""}
      <div class="row small muted"><span class="cd" data-cd data-s="${num(p.startAt)}" data-e="${num(p.endAt)}"></span>${p.endAt?`<span>· ปิด ${fmtDT(p.endAt)}</span>`:""}</div></div></div>
    ${win}
    ${hideRes?`<div class="notice small">${p.showResults==="after_end"?"ผลโหวตจะเปิดเผยเมื่อปิดโหวต":"โหวตก่อนแล้วจะเห็นผลคะแนน"}</div>`:""}
    <div class="opts">${opts}</div>
    <div class="row small muted"><span class="legend"><span><i style="background:${color}"></i>โหวตปกติ</span><span><i style="background:var(--boost)"></i>คะแนนจากเพชร</span></span><div class="spacer"></div>
      <span class="num">${fmtN(t.voters)} คนโหวต · ${fmtN(t.grand)} คะแนนรวม${myB?` · คุณใช้เพชร ${fmtN(myB)}`:""}</span></div>
  </div></article>`}
function animateBars(){requestAnimationFrame(()=>requestAnimationFrame(()=>{$$(".seg[data-w]").forEach(el=>{el.style.width=el.dataset.w+"%";S.prevW[el.dataset.k]=el.dataset.w})}))}
async function doVote(pid,opt){const p=S.polls[pid];if(!p)return;if(pollStatus(p)!=="live")return toast("กิจกรรมนี้ไม่ได้เปิดโหวตอยู่");
  const o=p.options.find(x=>x.id===opt);const mv=myVote(pid);const cur=mv?cleanChoices(p,mv):[];let next;
  if(p.mode==="single"){if(cur.length)return toast("คุณโหวตกิจกรรมนี้ไปแล้ว เปลี่ยนไม่ได้");
    if(!await confirmBox("ยืนยันการโหวต",`โหวตให้ <b>${esc((o.emoji||"")+" "+o.label)}</b> ใช่ไหม?<br><span class="muted small">โหวตได้ครั้งเดียว ยืนยันแล้วเปลี่ยนไม่ได้</span>`,"ยืนยันโหวต"))return;next=[opt]}
  else{if(cur.includes(opt)){if(p.allowChange===false)return toast("กิจกรรมนี้ยกเลิกโหวตไม่ได้");next=cur.filter(x=>x!==opt)}
    else{if(num(p.maxChoices)>0&&cur.length>=num(p.maxChoices))return toast(`เลือกได้สูงสุด ${num(p.maxChoices)} ข้อ ยกเลิกข้ออื่นก่อน`);next=[...cur,opt]}}
  const path="ballots/"+S.uid;
  await enqueue(path,async()=>{const b=clone(S.ballots[S.uid]||{votes:{},boosts:[]});delete b.id;b.votes=b.votes||{};b.boosts=b.boosts||[];
    if(p.mode==="single"&&b.votes[pid]&&cleanChoices(p,b.votes[pid]).length)return;
    if(next.length)b.votes[pid]={choices:next,at:Date.now()};else delete b.votes[pid];
    S.ballots[S.uid]={id:S.uid,...b};invalidate();renderView();
    if(await safeSet(path,b)&&next.includes(opt))toast("โหวตให้ "+o.label+" แล้ว 💖")})}
function openBoost(pid,opt){const p=S.polls[pid],o=p&&p.options.find(x=>x.id===opt);if(!o)return;const bal=balance(S.uid),cap=num(p.boostCap),used=myBoostIn(pid);

function normName(s){return String(s||"").toLowerCase().replace(/(นางสาว|น\.ส\.|นาย|นาง|ด\.ช\.|ด\.ญ\.|mr\.?|mrs\.?|ms\.?|miss)\s*/g,"").replace(/[\s.\-_]/g,"")}
function nameMatch(got,exp){const g=normName(got);if(!g)return false;return exp.some(e=>{const n=normName(e);if(n.length<2)return false;const k=n.slice(0,Math.min(n.length,4));return g.includes(k)||n.includes(g.slice(0,Math.min(g.length,4)))})}
function usedRefs(exceptUid,exceptK){const set=new Map();for(const [uid,d] of Object.entries(S.verify))for(const [k,v] of Object.entries(d.c||{})){if(uid===exceptUid&&k===exceptK)continue;
    const st=reqStatus(uid,k)[0];if(st==="no")continue;[v.qrRef,v.ai&&v.ai.ref].forEach(r=>{if(r&&String(r).length>=6)set.set(String(r).replace(/\s/g,""),uid+":"+k)})}
  for(const [uid,d] of Object.entries(S.allTopups))for(const [k,r] of Object.entries(d.reqs||{})){if(uid===exceptUid&&k===exceptK)continue;if(reqStatus(uid,k)[0]==="no")continue;if(r.slipRef&&r.slipRef.length>=6)set.set(r.slipRef,uid+":"+k)}
  return set}
async function verifyReq(uid,k,auto=false){const key=uid+":"+k;if(S.verifying[key])return;const r=((S.allTopups[uid]||{}).reqs||{})[k];if(!r||!S.sample)return;
  S.verifying[key]=true;dirty("view");const st=S.settings;
  try{const blob=await slipBlob(r);if(!blob)throw{code:"noimg"};
    const qr=await decodeQR(blob),qrRef=slipRef(qr);
    const expNames=[st.accountName,st.trueName,...String(st.matchNames||"").split(",")].map(s=>s.trim()).filter(Boolean);
    const expAcc=[st.promptpay,st.bankAccount,st.truePhone].map(digits).filter(d=>d.length>=4);
    const prompt=`You are checking a Thai money-transfer slip image (bank app or TrueMoney Wallet). Read it carefully and report ONLY what is printed.
Customer claims: method=${r.method==="tw"?"TrueMoney Wallet":"PromptPay / bank transfer"}, amount=${r.baht} THB, submitted at ${new Date(r.at).toISOString()}.
Reply with only JSON: {"is_slip":boolean,"bank":string,"amount":number|null,"datetime":"ISO 8601 with +07:00 (convert Buddhist year 25xx to Gregorian) or null","receiver_name":string,"receiver_account":string,"sender_name":string,"ref":string,"looks_edited":boolean,"notes":string}
receiver_account: account/phone/PromptPay as printed (keep x masks). ref: transaction reference number. looks_edited: true if fonts/alignment look tampered or it's a screenshot of something that isn't a completed transfer. notes: short Thai note.`;
    const ai=await S.sample.json(prompt,{images:[blob],modelTier:"default"});
    const checks=[],add=(ok,msg)=>checks.push({ok:!!ok,msg});
    add(ai&&ai.is_slip,ai&&ai.is_slip?"เป็นสลิปการโอนเงิน":"ภาพนี้ไม่ใช่สลิปโอนเงินที่สำเร็จ");
    const amt=num(ai&&ai.amount,NaN);add(Number.isFinite(amt)&&amt+0.001>=num(r.baht),Number.isFinite(amt)?`ยอดในสลิป ${fmtB(amt)} บาท ${amt+0.001>=num(r.baht)?"ครบตามคำขอ":"น้อยกว่าคำขอ "+fmtB(r.baht)+" บาท"}`:"อ่านยอดเงินไม่ได้");
    const accD=digits(ai&&ai.receiver_account),accOk=accD.length>=3&&expAcc.some(e=>e.endsWith(accD.slice(-3))||e.endsWith(accD.slice(-4)));
    const nmOk=nameMatch(ai&&ai.receiver_name,expNames);
    add(nmOk||accOk,nmOk||accOk?`ผู้รับตรงกับบัญชีแอดมิน (${nmOk?"ชื่อ":"เลขบัญชี"})`:`ผู้รับไม่ตรง: ${(ai&&ai.receiver_name)||"-"} ${(ai&&ai.receiver_account)||""}${!expNames.length&&!expAcc.length?" (ยังไม่ได้ตั้งชื่อ/เลขบัญชีในหน้าตั้งค่า)":""}`);
    const t=Date.parse(ai&&ai.datetime||""),maxAge=num(st.slipMaxAgeH,24)*3600e3;
    add(Number.isFinite(t)&&t<=num(r.at)+15*60e3&&num(r.at)-t<=maxAge,Number.isFinite(t)?`เวลาในสลิป ${fmtDT(t)} ${t>num(r.at)+15*60e3?"อยู่หลังเวลาที่ส่งคำขอ":num(r.at)-t>maxAge?"เก่าเกิน "+num(st.slipMaxAgeH,24)+" ชม.":"อยู่ในช่วงที่กำหนด"}`:"อ่านวันเวลาในสลิปไม่ได้");
    const used=usedRefs(uid,k),refs=[qrRef,ai&&ai.ref].filter(x=>x&&String(x).length>=6).map(x=>String(x).replace(/\s/g,""));const dupBy=refs.map(x=>used.get(x)).find(Boolean);
    add(!dupBy,dupBy?`สลิปซ้ำกับคำขอของ ${prof(dupBy.split(":")[0]).nick}`:refs.length?"เลขอ้างอิงไม่ซ้ำกับสลิปที่เคยใช้":"ไม่พบเลขอ้างอิง ตรวจซ้ำไม่ได้");
    if(!refs.length)checks[checks.length-1].ok=r.method==="tw";
    if(r.method!=="tw")add(!!qr,qr?"พบ QR ยืนยันรายการในสลิป":"ไม่พบ QR ยืนยันรายการ (สลิปธนาคารจริงมักมี QR)");
    add(!(ai&&ai.looks_edited),ai&&ai.looks_edited?"สลิปดูเหมือนถูกแก้ไข":"ไม่พบร่องรอยการแก้ไข");
    const pass=checks.every(c=>c.ok);
    const rec={at:Date.now(),auto,pass,checks,qrRef:qr?qrRef:"",ai:{bank:String(ai&&ai.bank||"").slice(0,40),amount:Number.isFinite(amt)?amt:null,datetime:String(ai&&ai.datetime||"").slice(0,40),receiver_name:String(ai&&ai.receiver_name||"").slice(0,60),receiver_account:String(ai&&ai.receiver_account||"").slice(0,40),ref:String(ai&&ai.ref||"").slice(0,60),notes:String(ai&&ai.notes||"").slice(0,160)}};
    const path="verify/"+uid;
    await enqueue(path,async()=>{const d=clone(S.verify[uid]||{c:{}});delete d.id;d.c=d.c||{};d.c[k]=rec;S.verify[uid]={id:uid,...d};await safeSet(path,d)});
    logAdmin("verify",`ตรวจสลิป ${prof(uid).nick} ${fmtB(r.baht)} บาท: ${pass?"ผ่าน":"ไม่ผ่าน"}`,{uid,k});
    if(pass&&st.autoApprove&&reqStatus(uid,k)[0]==="pending")await approveReq(uid,k,ptsFor(r.baht),null,true);
    else if(!auto)toast(pass?"สลิปผ่านการตรวจ กดอนุมัติได้เลย":"สลิปไม่ผ่านการตรวจ ดูรายละเอียดด้านล่าง");
  }catch(e){console.warn(e);const c=e&&e.code;
    if(c==="rate_limited"){S.autoMode=false;toast("ใช้งานตรวจสลิปถี่เกินไป หยุดโหมดอัตโนมัติชั่วคราว")}
    else if(c==="not_granted"||c==="sampling_disabled"||c==="images_unavailable"){S.sample=null;S.autoMode=false;toast("ไม่ได้รับอนุญาตให้ใช้ระบบตรวจสลิป")}
    else if(c==="noimg")toast("เปิดรูปสลิปไม่ได้");else toast("ตรวจสลิปไม่สำเร็จ ลองอีกครั้ง")}
  finally{delete S.verifying[key];dirty("view")}}
let autoBusy=false;
async function autoKick(){if(!S.autoMode||autoBusy||!S.sample)return;autoBusy=true;
  try{while(S.autoMode){const next=pendingTopups().find(x=>!((S.verify[x.uid]||{}).c||{})[x.k]&&(x.r.slipUrl||x.r.slipId));if(!next)break;await verifyReq(next.uid,next.k,true)}}
  finally{autoBusy=false}}
async function approveReq(uid,k,pts,reason,auto=false){const path="approvals/"+uid;const r=((S.allTopups[uid]||{}).reqs||{})[k];
  await enqueue(path,async()=>{const a=clone(S.approvals[uid]||{});delete a.id;a.granted=a.granted||{};a.rejected=a.rejected||{};
    if(reason!=null){a.rejected[k]=reason;delete a.granted[k]}else{a.granted[k]=pts;delete a.rejected[k]}
    if(await safeSet(path,a)){S.approvals[uid]={id:uid,...a};invalidate();

      toast(reason!=null?"ไม่อนุมัติแล้ว":(auto?"เติมเพชรอัตโนมัติ: ":"")+"+"+fmtN(pts)+" เพชรให้ "+who);dirty("view")}})}

/* ================= chat ================= */
function allMsgs(){const out=[];for(const [uid,d] of Object.entries(S.chats))(Array.isArray(d.msgs)?d.msgs:[]).forEach(m=>{if(m&&m.text)out.push({...m,uid})});
  out.sort((a,b)=>num(a.t)-num(b.t));return out.slice(-150)}
const EMOJI_ONLY=/^(?:\p{Extended_Pictographic}|\p{Emoji_Component}|‍|️|\s)+$/u;
function renderChatMsgs(first){const box=$("#msgs");if(!box)return;const msgs=allMsgs();
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  if(S.settings.chatEnabled===false&&!S.isOwner){box.innerHTML='<div class="sysline">แอดมินปิดแชทชั่วคราว</div>';return}
  box.innerHTML=msgs.length?msgs.map(m=>{const p=prof(m.uid),me=m.uid===S.uid,big=EMOJI_ONLY.test(m.text)&&/\p{Extended_Pictographic}/u.test(m.text)&&[...m.text.replace(/\s/g,"")].length<=8;
    return `<div class="msg ${me?"me":""}" data-mid="${esc(m.id)}" data-muid="${esc(m.uid)}"><span class="av">${esc(p.av||"🙂")}</span><div class="bub" data-act="reply" data-mid="${esc(m.id)}" data-muid="${esc(m.uid)}">
      <div class="meta"><b>${nickHTML(m.uid)}</b>${isAdminUid(m.uid)?'<span class="adm">แอดมิน</span>':""}<time>${fmtClock(num(m.t))}</time></div>
      ${m.re?`<div class="quote">↪ ${esc(prof(m.re.uid).nick)}: ${esc(String(m.re.text).slice(0,60))}</div>`:""}
      <div class="txt ${big?"big":""}">${esc(m.text)}</div></div>
      <div class="acts"><button data-act="reply" data-mid="${esc(m.id)}" data-muid="${esc(m.uid)}">ตอบ</button>${me||S.isOwner?`<button data-act="delmsg" data-mid="${esc(m.id)}" data-muid="${esc(m.uid)}">ลบ</button>`:""}</div></div>`}).join(""):'<div class="sysline">ยังไม่มีข้อความ ทักทายกันหน่อย 👋</div>';
  if(first||near||S.chatFirst)box.scrollTop=box.scrollHeight;
  const last=msgs.length?num(msgs[msgs.length-1].t):0;
  if(!S.chatFirst&&last>S.chatSeen&&!S.chatVisible){const n=msgs.filter(m=>num(m.t)>S.chatSeen&&m.uid!==S.uid).length;if(n){S.unread+=n;updFab()}}
  if(S.chatVisible){S.unread=0;updFab()}
  if(S.loaded.chat)S.chatFirst=false;S.chatSeen=Math.max(S.chatSeen,last)}
function updFab(){const b=$("#fabBadge");if(!b)return;b.textContent=S.unread>99?"99+":S.unread;b.classList.toggle("hide",!S.unread)}
function onlineList(){const m=new Map();for(const p of S.peers){if(p.kind!=="viewer")continue;const uid=p.by||(p.presence&&p.presence.uid)||p.peer;
    const prev=m.get(uid);m.set(uid,{uid,me:p.isMe||(prev&&prev.me),typing:!!(p.presence&&p.presence.typing&&Date.now()-num(p.presence.typingAt)<6000)||(prev&&prev.typing),pres:p.presence||{}})}
  if(S.uid&&!m.has(S.uid))m.set(S.uid,{uid:S.uid,me:true,typing:false,pres:{}});
  return [...m.values()].sort((a,b)=>(b.me-a.me))}
function renderOnline(){const el=$("#online");if(!el)return;const list=onlineList();
  $("#onCount").textContent="ออนไลน์ "+list.length+" คน";
  el.innerHTML=(S.room?"":'<span class="small muted">กำลังเชื่อมต่อห้องแชท…</span>')+list.map(o=>{const p=S.profiles[o.uid]||{nick:o.pres.nick||"ผู้เยี่ยมชม",av:o.pres.av||"🙂"};

function setPresence(){if(!S.room||!S.loggedIn)return;const p=prof(S.uid);S.room.presence({uid:S.uid,nick:String(p.nick||"").slice(0,20),av:p.av||"🙂",typing:false}).catch(()=>{})}
function wireChat(){const inp=$("#chatIn"),pk=$("#picker");
  let tab=Object.keys(EMOJI_SETS)[0];
  const drawPicker=()=>{pk.innerHTML=`<div class="ptabs">${[...Object.keys(EMOJI_SETS),"สติกเกอร์"].map(k=>`<button type="button" aria-selected="${k===tab}" data-pt="${k}">${k}</button>`).join("")}</div>
     <div class="eg ${tab==="สติกเกอร์"?"stk":""}">${(tab==="สติกเกอร์"?STICKERS:EMOJI_SETS[tab]).map(e=>`<button type="button" data-em="${e}" aria-label="${e}">${e}</button>`).join("")}</div>`};
  drawPicker();
  $("#eBtn").onclick=e=>{e.stopPropagation();pk.classList.toggle("hide")};
  pk.onclick=e=>{e.stopPropagation();const t=e.target.closest("[data-pt]");if(t){tab=t.dataset.pt;drawPicker();return}
    const em=e.target.closest("[data-em]");if(!em)return;
    if(tab==="สติกเกอร์"){sendMsg(em.dataset.em);pk.classList.add("hide");return}
    const s=inp.selectionStart??inp.value.length,en=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+em.dataset.em+inp.value.slice(en);inp.focus();const c=s+em.dataset.em.length;inp.setSelectionRange(c,c)};
  document.addEventListener("click",e=>{if(!pk.contains(e.target)&&e.target!==$("#eBtn"))pk.classList.add("hide")});

  let typing=false;
  inp.oninput=()=>{if(!S.room)return;if(!typing&&inp.value){typing=true;S.room.presence({typing:true,typingAt:Date.now()}).catch(()=>{})}
    clearTimeout(S.typingTimer);S.typingTimer=setTimeout(()=>{typing=false;S.room.presence({typing:false}).catch(()=>{})},2500)};
  $("#sendBtn").onclick=()=>sendMsg(inp.value);
  $("#replyX").onclick=()=>setReply(null);
  $("#fab").onclick=()=>{$("#chat").scrollIntoView({behavior:"smooth",block:"end"});setTimeout(()=>inp.focus({preventScroll:true}),400)};
  if("IntersectionObserver" in window){new IntersectionObserver(es=>{S.chatVisible=es[0].isIntersecting;if(S.chatVisible){S.unread=0;updFab()}},{threshold:.2}).observe($("#chat"))}}
function setReply(m){S.replyTo=m;const bar=$("#replyBar");if(!bar)return;bar.classList.toggle("hide",!m);if(m){$("#replyTxt").textContent="ตอบกลับ "+prof(m.uid).nick+": "+m.text;$("#chatIn").focus()}}
let lastSend=0;
async function sendMsg(text){text=String(text||"").trim();if(!text)return;if(S.settings.chatEnabled===false&&!S.isOwner)return toast("แชทถูกปิดชั่วคราว");
  if(Date.now()-lastSend<800)return toast("พิมพ์ช้าลงนิดนึงนะ");lastSend=Date.now();
  const m={id:rid(),t:Date.now(),text:text.slice(0,300)};if(S.replyTo)m.re={uid:S.replyTo.uid,id:S.replyTo.id,text:String(S.replyTo.text).slice(0,80)};
  const inp=$("#chatIn");inp.value="";setReply(null);if(S.room)S.room.presence({typing:false}).catch(()=>{});
  const path="chat/"+S.uid;
  await enqueue(path,async()=>{const d=clone(S.chats[S.uid]||{msgs:[]});delete d.id;d.msgs=(d.msgs||[]).concat(m).slice(-40);
    S.chats[S.uid]={id:S.uid,...d};renderChatMsgs(true);if(!await safeSet(path,d)){inp.value=text}})}
async function delMsg(uid,id){if(!(uid===S.uid||S.isOwner))return;if(!await confirmBox("ลบข้อความ","ลบข้อความนี้ใช่ไหม?","ลบ",true))return;const path="chat/"+uid;

const RANKC=["#f5b301","#94a3b8","#cd7f32","#ff4f8b","#3b8cff","#14b394","#9a5cf6","#ff6f4f","#0891b2","#65a30d"];
const SC_TYPES=["ประถม","มัธยม","เอกชน","อาชีวะ","อื่นๆ"];
const SC_DEFAULT={title:"โหวตโรงเรียนในดวงใจ จังหวัดจันทบุรี",desc:"เลือกโรงเรียนของคุณแล้วกดโหวต คนละ 1 เสียง ผลอัปเดตสด",open:true,startAt:0,endAt:0,allowChange:false,showLive:true,resetAt:0};
S.scList=[];S.scConf={...SC_DEFAULT};S.scDistrict="all";S.scQ="";S.bigOpen=false;
const dcol=d=>DCOL[d]||"#7d6886";
let _ST=null;
function scStatus(now=Date.now()){const c=S.scConf;if(c.open===false)return"closed";if(c.startAt&&now<c.startAt)return"up";if(c.endAt&&now>=c.endAt)return"end";return"live"}
function schoolTally(){if(_ST)return _ST;const c=S.scConf,ids=new Map(S.scList.map(s=>[s.id,s])),cnt={},byD={};let total=0;
  for(const [uid,b] of Object.entries(S.ballots)){const v=b.school;if(!v||!ids.has(v.id))continue;const at=num(v.at);
    if(c.resetAt&&at<c.resetAt)continue;if(c.startAt&&at<c.startAt)continue;if(c.endAt&&at>c.endAt+5000)continue;
    cnt[v.id]=(cnt[v.id]||0)+1;total++;const d=ids.get(v.id).d;byD[d]=(byD[d]||0)+1}
  const ranked=S.scList.filter(s=>cnt[s.id]).sort((a,b)=>cnt[b.id]-cnt[a.id]||a.n.localeCompare(b.n,"th"));
  _ST={cnt,total,ranked,byD};return _ST}
function mySchool(){const b=S.ballots[S.uid],v=b&&b.school;if(!v)return null;if(S.scConf.resetAt&&num(v.at)<S.scConf.resetAt)return null;return S.scList.find(s=>s.id===v.id)?v:null}
function scSubscribe(){
  sub(S.db.doc("schoolvote/list"),"sclist",s=>{S.scList=s.exists&&Array.isArray(s.data().schools)?s.data().schools:[];_ST=null;dirty("view");renderBig();if(!s.exists&&!s.metadata.fromCache&&S.isOwner)seedSchools(false)});
  sub(S.db.doc("schoolvote/config"),"scconf",s=>{S.scConf={...SC_DEFAULT,...(s.exists?s.data():{})};_ST=null;dirty("view");renderBig()});
}
function lbHTML(n=10,big=false){const T=schoolTally(),top=T.ranked.slice(0,n),max=top.length?T.cnt[top[0].id]:1;
  if(!top.length)return `<div class="${big?"":"muted"}" style="padding:1rem 0;text-align:center">ยังไม่มีคะแนนโหวต มาเป็นคนแรกกัน!</div>`;

    return `<div class="lbrow ${i<3?"top":""} r${i+1}" style="--c:${c}"><div class="fill" data-k="${k}" data-w="${(v/max*100).toFixed(1)}" style="width:${S.prevW[k]||0}%"></div>

function scListRender(){const box=$("#scList");if(!box)return;const T=schoolTally(),m=mySchool(),st=scStatus(),q=S.scQ.trim().replace(/^โรงเรียน/,"").toLowerCase();

async function scVote(id){const s=S.scList.find(x=>x.id===id);if(!s)return;if(scStatus()!=="live")return toast("ตอนนี้ไม่ได้เปิดโหวต");if(mySchool())return toast("คุณโหวตไปแล้ว คนละ 1 เสียง");

    <label for="scDs">คำอธิบาย<input type="text" id="scDs" maxlength="160" value="${esc(c.desc)}"></label>
    <div class="grid2"><label for="scS">เริ่มโหวต (เว้นว่าง = ทันที)<input type="datetime-local" id="scS" value="${toLocalInput(c.startAt)}"></label><label for="scE">ปิดโหวต (เว้นว่าง = ไม่จำกัด)<input type="datetime-local" id="scE" value="${toLocalInput(c.endAt)}"></label></div>
    <label class="check"><input type="checkbox" id="scOpen" ${c.open!==false?"checked":""}> เปิดให้โหวต</label>
    <label class="check"><input type="checkbox" id="scChg" ${c.allowChange?"checked":""}> ให้เปลี่ยนโรงเรียนได้ (ปิด = 1 คน 1 เสียง เปลี่ยนไม่ได้)</label>
    <label class="check"><input type="checkbox" id="scLive" ${c.showLive!==false?"checked":""}> แสดงผลสดให้ทุกคนเห็น</label>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn danger" data-act="screset">ล้างผลโหวตทั้งหมด</button><button class="btn pri" type="submit">บันทึก</button></div></form>
   <div class="card stack"><div class="row"><h3>รายชื่อโรงเรียนแยกอำเภอ</h3><div class="spacer"></div><button class="btn sm" data-act="scseed">เติมรายชื่อเริ่มต้นที่ขาด</button><button class="btn sm" data-act="scimport">นำเข้าหลายรายการ</button></div>
    ${DISTRICTS.concat(Object.keys(groups).filter(d=>!DISTRICTS.includes(d))).filter(d=>groups[d]).map(d=>`<details data-d="${esc(d)}" ${openD.has(d)?"open":""}><summary class="schead" style="--c:${dcol(d)};cursor:pointer"><i></i>อำเภอ${esc(d)} <span class="small muted">${groups[d].length} โรงเรียน · ${fmtN(T.byD[d]||0)} เสียง</span></summary>
      <div class="stack" style="gap:.35rem;margin:.4rem 0 .8rem">${groups[d].sort((a,b)=>(T.cnt[b.id]||0)-(T.cnt[a.id]||0)||a.n.localeCompare(b.n,"th")).map(s=>`<div class="scrow" style="--c:${dcol(d)}"><div class="nm">${esc(s.n)}<small>${esc(s.t||"")}</small></div><span class="cnt">${fmtN(T.cnt[s.id]||0)} เสียง</span><div class="row"><button class="btn sm" data-act="scedit" data-id="${s.id}">แก้ไข</button><button class="btn sm danger" data-act="scdel" data-id="${s.id}">ลบ</button></div></div>`).join("")}</div></details>`).join("")||'<div class="muted">ยังไม่มีรายชื่อ</div>'}</div>`;
  $("#scConfForm").onsubmit=async e=>{e.preventDefault();const d={...clone(S.scConf),title:$("#scT").value.trim()||SC_DEFAULT.title,desc:$("#scDs").value.trim(),startAt:$("#scS").value?new Date($("#scS").value).getTime():0,endAt:$("#scE").value?new Date($("#scE").value).getTime():0,
    open:$("#scOpen").checked,allowChange:$("#scChg").checked,showLive:$("#scLive").checked};
    if(d.endAt&&d.endAt<=Date.now()&&!await confirmBox("เวลาปิดโหวตผ่านไปแล้ว",`คุณตั้งปิดโหวต ${fmtDT(d.endAt)} ซึ่งผ่านมาแล้ว ทุกคนจะโหวตไม่ได้ ตรวจเดือน/ปีอีกครั้ง<br>ยังต้องการบันทึกแบบนี้ไหม?`,"บันทึกต่อ",true))return;
    if(d.startAt&&d.endAt&&d.endAt<=d.startAt){toast("เวลาปิดต้องอยู่หลังเวลาเริ่ม");return}
    await enqueue("schoolvote/config",async()=>{if(await safeSet("schoolvote/config",d)){S.scConf=d;_ST=null;logAdmin("school","แก้ไขการตั้งค่าโหวตโรงเรียน");toast("บันทึกแล้ว")}})}}
async function saveSchools(list,msg){await enqueue("schoolvote/list",async()=>{if(await safeSet("schoolvote/list",{schools:list})){S.scList=list;_ST=null;if(msg){logAdmin("school",msg);toast(msg)}dirty("view")}})}
function openSchoolEditor(id){const s=id?S.scList.find(x=>x.id===id):{n:"",d:DISTRICTS[0],t:"ประถม"};
  openModal(`<h3>${id?"แก้ไขโรงเรียน":"เพิ่มโรงเรียน"}</h3><label for="seN">ชื่อโรงเรียน (ไม่ต้องพิมพ์คำว่าโรงเรียน)<input type="text" id="seN" maxlength="90" value="${esc(s.n)}"></label>
   <div class="grid2"><label for="seD">อำเภอ<select id="seD">${DISTRICTS.map(d=>`<option ${d===s.d?"selected":""}>${d}</option>`).join("")}</select></label><label for="seT">ประเภท<select id="seT">${SC_TYPES.map(t=>`<option ${t===s.t?"selected":""}>${t}</option>`).join("")}</select></label></div>
   <div class="err" id="seErr"></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn pri" id="seOk">บันทึก</button></div>`,
  {onMount:b=>{$("#seOk",b).onclick=async()=>{const n=$("#seN").value.trim().replace(/^โรงเรียน/,"").trim();if(!n)return $("#seErr").textContent="ใส่ชื่อโรงเรียน";
    const d=$("#seD").value,t=$("#seT").value;if(S.scList.some(x=>x.id!==id&&x.n===n&&x.d===d))return $("#seErr").textContent="มีโรงเรียนนี้ในอำเภอนี้แล้ว";
    const list=S.scList.map(x=>({...x}));if(id){const x=list.find(y=>y.id===id);Object.assign(x,{n,d,t})}else list.push({id:"s"+rid(),n,d,t});
    closeModal();saveSchools(list,(id?"แก้ไข":"เพิ่ม")+"โรงเรียน "+n)}}})}
function openSchoolImport(){openModal(`<h3>นำเข้ารายชื่อโรงเรียน</h3><p class="small muted" style="margin:0">บรรทัดละ 1 โรงเรียน รูปแบบ <b>อำเภอ|ชื่อโรงเรียน|ประเภท</b> (ประเภทไม่ใส่ก็ได้)</p>
  <textarea id="imT" style="min-height:200px" placeholder="ท่าใหม่|บ้านตัวอย่าง|ประถม"></textarea><label class="check"><input type="checkbox" id="imR"> แทนที่รายชื่อเดิมทั้งหมด (ผลโหวตของโรงเรียนที่หายไปจะไม่นับ)</label>
  <div class="err" id="imErr"></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn pri" id="imOk">นำเข้า</button></div>`,
  {wide:true,onMount:b=>{$("#imOk",b).onclick=()=>{const rows=$("#imT").value.split(/\n+/).map(l=>l.split("|").map(x=>x.trim())).filter(r=>r[0]&&r[1]);if(!rows.length)return $("#imErr").textContent="ไม่พบข้อมูลในรูปแบบที่กำหนด";
    const base=$("#imR").checked?[]:S.scList.map(x=>({...x}));let added=0;
    for(const r of rows){const d=r[0].replace(/^อ(ำเภอ|\.)\s*/,""),n=r[1].replace(/^โรงเรียน/,"").trim();if(base.some(x=>x.n===n&&x.d===d))continue;base.push({id:"s"+rid()+added,n,d,t:r[2]||"อื่นๆ"});added++}
    closeModal();saveSchools(base,`นำเข้าโรงเรียน ${added} รายการ`)}}})}

let seeding=false;
async function seedSchools(replace){if(seeding)return;seeding=true;try{const r=await fetch("schools.json");if(!r.ok)throw 0;const d=await r.json();
  const list=replace?d.schools:S.scList.concat(d.schools.filter(x=>!S.scList.some(y=>y.n===x.n&&y.d===x.d)));
  await saveSchools(list,`โหลดรายชื่อโรงเรียนจันทบุรี ${d.schools.length} แห่ง`)}catch(e){console.warn(e);toast("โหลดรายชื่อเริ่มต้นไม่สำเร็จ")}seeding=false}

boot();
</script>
</body>
</html>
